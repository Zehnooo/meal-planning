<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Takeout-at-Home Meal Planner</title>
<style>
:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --border:#d1d5db;
  --accent:#2563eb;
  --soft:#f9fafb;
  --green:#15803d;
  --red:#b91c1c;
  --shadow:0 1px 3px #00000012;
  --radius:8px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.45;
}
header{background:#0f172a;color:#fff;padding:22px 24px}
header h1{margin:0 0 6px;font-size:1.9rem;letter-spacing:0}
header p{margin:0;color:#cbd5e1}
.app{max-width:1220px;margin:auto;padding:18px}
.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  position:sticky;
  top:0;
  background:rgba(244,246,248,.96);
  padding:12px 0;
  z-index:10;
}
.tabbtn{
  min-height:40px;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  padding:9px 14px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer;
}
.tabbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab{display:none}
.tab.active{display:block}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:16px;
}
details.card summary{
  cursor:pointer;
  list-style:none;
}
details.card summary::-webkit-details-marker{display:none}
details.card summary h2{display:inline;margin:0}
details.card summary::after{
  content:'Show';
  float:right;
  color:var(--accent);
  font-weight:800;
}
details.card[open] summary{margin-bottom:12px}
details.card[open] summary::after{content:'Hide'}
.grid{display:grid;gap:16px;align-items:start}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
h2,h3{margin:0 0 12px;letter-spacing:0}
p{margin:0 0 12px}
ul{margin:10px 0 0;padding-left:20px}
.muted{color:var(--muted)}
.note{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e3a8a;
  padding:12px 14px;
  border-radius:var(--radius);
  margin:12px 0 0;
}
label{display:block;font-weight:750;margin:12px 0 6px}
input,select,textarea{
  width:100%;
  min-height:42px;
  font:inherit;
  color:var(--text);
  border:1px solid var(--border);
